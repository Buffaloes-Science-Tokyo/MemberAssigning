workflows:
  ios-workflow:
    name: Kick Members iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.kickmembers.kickMembers
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Set up code signing settings on Xcode project
        script: |
          cd app
          xcode-project use-profiles
      - name: Build ipa
        script: |
          cd app
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - rui.shikada4667@gmail.com
        notify:
          success: true
          failure: true
